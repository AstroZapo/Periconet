name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de Release opcional (p. ej. v0.4.0) para publicar al ejecutar manualmente"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Build Periconet.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole `
            --name Periconet `
            --add-data "frontend;frontend" `
            --hidden-import app `
            --hidden-import camera_credentials_win `
            --collect-submodules uvicorn `
            --collect-submodules websockets `
            --collect-submodules pystray `
            periconet.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Periconet-Windows
          path: dist/Periconet.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (.zip)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Build Periconet.app
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name Periconet \
            --osx-bundle-identifier com.periconet.app \
            --add-data "frontend:frontend" \
            --hidden-import app \
            --hidden-import camera_credentials_mac \
            --hidden-import AppKit \
            --collect-submodules uvicorn \
            --collect-submodules websockets \
            --collect-submodules pystray \
            periconet.py

      - name: Package Periconet-macOS.zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Periconet.app dist/Periconet-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Periconet-macOS
          path: dist/Periconet-macOS.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/Periconet.exe
            release-assets/Periconet-macOS.zip
